<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Army Builder | Space Marine Command</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html">SPACE MARINE COMMAND</a><nav class="nav"><a href="index.html">Home</a><a href="datasheets.html">Datasheets</a><a class="active" href="army-builder.html">Army Builder</a><a href="my-armies.html">My Armies</a><a href="login.html" id="authLink">Login</a></nav></header><main class="container"><div class="page-heading"><div><p class="eyebrow">LIST BUILDING</p><h1>Army Builder</h1></div><button id="saveArmyBtn" class="button primary">Save Army</button></div><section class="grid builder-layout"><div><div class="panel"><label class="label">Army name</label><input id="armyName" class="input" value="My Space Marines"><div class="form-row"><div><label class="label">Point limit</label><select id="pointLimit" class="input"><option value="1000">1000</option><option value="1500">1500</option><option value="2000" selected>2000</option><option value="3000">3000</option></select></div><div><label class="label">Detachment</label><input id="detachment" class="input" value="Gladius Task Force"></div></div></div><div class="panel"><div class="section-title-row"><h2>Add Units</h2><input id="unitSearch" class="input compact" placeholder="Search..."></div><div id="availableUnits" class="stack"></div></div></div><aside><div class="panel sticky"><div class="army-total"><div><span class="muted">TOTAL</span><strong id="pointsTotal">0 / 2000 pts</strong></div><div class="progress"><span id="progressBar"></span></div></div><div id="armyUnits" class="stack"></div><p id="emptyArmy" class="muted">No units added yet.</p></div></aside></section><p id="saveStatus" class="status"></p></main><script type="module" src="js/army-builder.js"></script><script type="module" src="js/auth-ui.js"></script></body></html>
